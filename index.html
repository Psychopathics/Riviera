<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>RIVERA – Verwaltung</title>
<style>
:root{--g:#dfbd67;--g2:#f3dfa0;--bg:#090909;--p:#151515;--line:#59491f;--muted:#b8ad91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4efdf;font:16px Arial,sans-serif}header{text-align:center;padding:22px 12px 16px;background:#0d0d0d;border-bottom:1px solid var(--line)}.skull{font-size:40px;color:var(--g2)}h1{margin:6px 0;color:var(--g2);letter-spacing:7px;font-size:30px}.sub{font-size:11px;color:var(--muted);letter-spacing:2px}main{max-width:1000px;margin:18px auto;padding:0 12px}.panel{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}h2,h3{color:var(--g2);margin:0 0 12px}label{display:block;color:var(--muted);font-size:13px}input,select{width:100%;padding:11px;margin:5px 0 12px;background:#090909;color:#fff;border:1px solid #66552d;border-radius:7px;font-size:16px}button{padding:11px 14px;margin:3px 4px 3px 0;background:var(--g);color:#111;border:0;border-radius:7px;font-weight:bold;font-size:14px;cursor:pointer}button.alt{background:#292929;color:var(--g2);border:1px solid var(--line)}button.danger{background:#6c2929;color:white}button:disabled{opacity:.55;cursor:not-allowed}nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}nav button{flex:1 1 110px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{background:#0d0d0d;border:1px solid #40351f;border-radius:8px;padding:12px}.stat b{display:block;color:var(--g2);font-size:22px;margin-top:5px}.muted,small{color:var(--muted)}.notice{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--g2);margin:10px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:540px;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid #40351f;vertical-align:top}th{color:var(--g2)}.log{border-bottom:1px solid #40351f;padding:9px 0;font-size:14px}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:20px;color:var(--g2);font-size:12px}footer{text-align:center;color:#80775f;padding:22px;font-size:12px}.status{font-size:12px;color:var(--muted)}.online{color:#9bd69b}.error{color:#ff9999}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body>
<header><div class="skull">☠</div><h1>RIVERA</h1><div class="sub">MITGLIEDER- & LAGERVERWALTUNG</div></header><main>
<section id="auth" class="panel"><h2>Anmelden</h2><div class="notice">Online-Version: Bitte mit deiner registrierten E-Mail-Adresse anmelden. Neue Konten erhalten zunächst Mitgliederrechte.</div><label>E-Mail-Adresse<input id="loginEmail" type="email" autocomplete="username" placeholder="name@beispiel.de"></label><label>Passwort<input id="loginPass" type="password" autocomplete="current-password" placeholder="Passwort"></label><button onclick="login()">Anmelden</button><button class="alt" onclick="toggleReg()">Registrieren</button>
<div id="reg" class="hidden"><hr style="border-color:#59491f"><h3>Neues Mitglied</h3><label>Anzeigename<input id="regName" placeholder="Vor- und Nachname"></label><label>E-Mail-Adresse<input id="regEmail" type="email" placeholder="name@beispiel.de"></label><label>Passwort (mindestens 8 Zeichen)<input id="regPass" type="password" minlength="8" placeholder="Passwort"></label><button onclick="registerUser()">Konto erstellen</button></div><div id="authMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="panel topline"><div><h2 style="margin:0">RIVERA – Verwaltung</h2><span id="welcome" class="muted"></span> · <span id="role" class="pill"></span><div id="conn" class="status">Verbinde …</div></div><button class="alt" onclick="logout()">Abmelden</button></div>
<nav><button onclick="page('home')">Start</button><button onclick="page('members')">Mitglieder</button><button onclick="page('leader')">Führungslager</button><button onclick="page('general')">Reguläres Lager</button><button onclick="page('attendance')">Anwesenheit</button><button onclick="page('routes')">Routen</button><button onclick="page('dues')">Wochenabgabe</button><button onclick="page('protocol')">Gesamtprotokoll</button></nav><div id="content" class="panel"></div></section></main><footer>RIVERA · Zentrale Online-Datenbank · Änderungen werden live synchronisiert</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Nach dem Anlegen deines Supabase-Projekts hier URL und anon key eintragen.
const SUPABASE_URL='HIER_SUPABASE_PROJECT_URL_EINTRAGEN';
const SUPABASE_ANON_KEY='HIER_SUPABASE_ANON_KEY_EINTRAGEN';
let sb=null,user=null,profile=null,active='home',channel=null,cache={members:[],users:[],leader:{items:[],logs:[]},general:{items:[],logs:[]},attendance:[],routes:[],dues:[]};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin=()=>profile?.role==='admin';
function configured(){return SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('HIER_')&&SUPABASE_ANON_KEY.length>20&&!SUPABASE_ANON_KEY.includes('HIER_')}
function msg(t,error=false){$('authMsg').textContent=t;$('authMsg').className='status '+(error?'error':'')}
function toggleReg(){$('reg').classList.toggle('hidden')}
async function init(){if(!configured()){msg('Noch nicht verbunden: Bitte SUPABASE_URL und SUPABASE_ANON_KEY in dieser Datei eintragen. SQL-Setup liegt der Lieferung bei.',true);return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);sb.auth.onAuthStateChange(async(_event,session)=>{if(session&&!user)await enter(session.user);else if(!session&&user)showAuth()})}
async function login(){if(!sb)return msg('Supabase ist noch nicht eingerichtet.',true);const email=$('loginEmail').value.trim(),password=$('loginPass').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return msg(error.message,true);await enter(data.user)}
async function registerUser(){if(!sb)return msg('Supabase ist noch nicht eingerichtet.',true);const name=$('regName').value.trim(),email=$('regEmail').value.trim(),password=$('regPass').value;if(!name||!email||password.length<8)return msg('Bitte Name, gültige E-Mail und Passwort (mindestens 8 Zeichen) eingeben.',true);const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)return msg(error.message,true);if(data.session){await enter(data.user)}else msg('Konto angelegt. Bitte ggf. deine E-Mail bestätigen und anschließend anmelden.')}
async function enter(u){user=u;let {data,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error){msg('Profil konnte nicht geladen werden: '+error.message,true);return}profile=data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Angemeldet: '+(profile.display_name||u.email);$('role').textContent=isAdmin()?'ADMIN':'MITGLIED';await loadAll();subscribe();page('home')}
async function logout(){if(channel)await sb.removeChannel(channel);channel=null;await sb.auth.signOut();showAuth()}
function showAuth(){user=null;profile=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
function setConn(t,ok=true){$('conn').textContent=t;$('conn').className='status '+(ok?'online':'error')}
async function loadAll(){const specs=[['members','members'],['profiles','profiles'],['attendance','attendance'],['routes','routes'],['dues','dues'],['stock_items','stock_items'],['stock_logs','stock_logs']];let results=await Promise.all(specs.map(([table])=>sb.from(table).select('*').order('created_at',{ascending:false})));for(let i=0;i<specs.length;i++){if(results[i].error){console.error(results[i].error);continue}let rows=results[i].data||[];switch(specs[i][0]){case'members':cache.members=rows;break;case'profiles':cache.users=rows;break;case'attendance':cache.attendance=rows;break;case'routes':cache.routes=rows;break;case'dues':cache.dues=rows;break;case'stock_items':cache.leader.items=rows.filter(x=>x.warehouse==='leader');cache.general.items=rows.filter(x=>x.warehouse==='general');break;case'stock_logs':cache.leader.logs=rows.filter(x=>x.warehouse==='leader');cache.general.logs=rows.filter(x=>x.warehouse==='general');break}}}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('rivera-live').on('postgres_changes',{event:'*',schema:'public'},async payload=>{await loadAll();page(active)}).subscribe(status=>setConn(status==='SUBSCRIBED'?'● Live verbunden – Änderungen werden sofort übernommen':'Synchronisierung: '+status,status==='SUBSCRIBED'))}
function page(p){active=p;let d=cache,h='';if(p==='home'){h='<h2>Übersicht</h2><div class="grid"><div class="stat">Mitglieder<b>'+d.members.length+'</b></div><div class="stat">Artikel Führungslager<b>'+d.leader.items.length+'</b></div><div class="stat">Artikel reguläres Lager<b>'+d.general.items.length+'</b></div><div class="stat">Lagerbewegungen<b>'+(d.leader.logs.length+d.general.logs.length)+'</b></div></div><div class="notice">Zentrale Bestände. Buchungen werden serverseitig verarbeitet und auf allen angemeldeten Geräten live angezeigt.</div>'}
if(p==='members'){h='<h2>Mitgliederverwaltung</h2>';if(isAdmin())h+='<div class="grid"><label>Mitglied / Name<input id="mName" placeholder="Vor- und Nachname"></label><label>Rang<select id="mRank">'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">Rang '+(i+1)+'</option>').join('')+'</select></label></div><button onclick="addMember()">Mitglied eintragen</button>';else h+='<div class="notice">Nur Administratoren können Mitglieder verwalten.</div>';h+='<div class="tablewrap"><table><thead><tr><th>Mitglied</th><th>Rang</th>'+(isAdmin()?'<th>Aktion</th>':'')+'</tr></thead><tbody>'+d.members.map(m=>'<tr><td>'+esc(m.name)+'</td><td>Rang '+esc(m.rank)+'</td>'+(isAdmin()?'<td><button class="danger" onclick="delMember(\''+m.id+'\')">Löschen</button></td>':'')+'</tr>').join('')+'</tbody></table></div>';if(isAdmin())h+='<h3 style="margin-top:22px">Benutzerkonten & Rollen</h3><div class="notice">Neue Registrierungen starten als Mitglied. Hier kannst du weitere Administratoren freischalten.</div><div class="tablewrap"><table><thead><tr><th>Benutzer</th><th>Rolle</th><th>Ändern</th></tr></thead><tbody>'+d.users.map(u=>'<tr><td>'+esc(u.display_name)+'</td><td>'+esc(u.role)+'</td><td>'+(u.id===user.id?'Eigenes Konto': '<button class="alt" onclick="setUserRole(\''+u.id+'\',\''+(u.role==='admin'?'member':'admin')+'\')">'+(u.role==='admin'?'Zum Mitglied machen':'Zum Admin machen')+'</button>')+'</td></tr>').join('')+'</tbody></table></div>'}
if(p==='leader'||p==='general'){let key=p,store=d[key],title=p==='leader'?'Führungslager':'Reguläres Lager';h='<h2>'+title+'</h2><div class="notice">Bemerkungen werden bei jeder Ein- und Ausbuchung gespeichert. Bestände werden zentral und automatisch berechnet.</div><h3>Neue Lagerbuchung</h3><div class="grid"><label>Artikel / Item<input id="itemName" placeholder="z. B. Funkgerät"></label><label>Bewegung<select id="moveType"><option value="in">Eingang</option><option value="out">Ausgang</option></select></label><label>Menge<input id="moveQty" type="number" min="1" step="1" placeholder="Anzahl"></label><label>Bemerkung zur Buchung<input id="itemNote" placeholder="z. B. Lieferung, ausgegeben an …"></label></div><button onclick="bookStock(\''+key+'\')">Buchung speichern</button><h3>Aktueller Lagerbestand</h3><div class="tablewrap"><table><thead><tr><th>Artikel / Item</th><th>Gesamtbestand</th></tr></thead><tbody>'+store.items.map(it=>'<tr><td><b>'+esc(it.name)+'</b></td><td><b style="color:var(--g2);font-size:18px">'+it.stock+'</b></td></tr>').join('')+'</tbody></table></div>'+(store.items.length?'':'<p class="muted">Noch keine Artikel im Bestand.</p>')+'<h3>Lagerprotokoll</h3>'+renderLogs(store.logs)}
if(p==='protocol')h='<h2>Gesamtprotokoll</h2><h3>Führungslager</h3>'+renderLogs(d.leader.logs)+'<h3>Reguläres Lager</h3>'+renderLogs(d.general.logs);
if(['attendance','routes','dues'].includes(p)){let cfg={attendance:['Anwesenheit','Name / Status / Notiz'],routes:['Routen','Route / Treffpunkt / Notiz'],dues:['Wochenabgabe','Name – Betrag – Kalenderwoche']}[p];h='<h2>'+cfg[0]+'</h2><input id="simpleEntry" placeholder="'+cfg[1]+'"><button onclick="addSimple(\''+p+'\')">Eintragen</button>'+d[p].map(v=>'<div class="log">'+esc(v.entry)+' <small>· '+esc(v.created_by_name||'')+'</small> '+(isAdmin()?'<button class="danger" onclick="delSimple(\''+p+'\',\''+v.id+'\')">Löschen</button>':'')+'</div>').join('')}
$('content').innerHTML=h}
function renderLogs(logs){if(!logs.length)return '<p class="muted">Noch keine Lagerbewegungen protokolliert.</p>';return logs.slice(0,150).map(x=>'<div class="log"><b>'+new Date(x.created_at).toLocaleString('de-DE')+'</b> · '+esc(x.user_name)+' · <span class="pill">'+(x.move_type==='in'?'EINGANG':'AUSGANG')+'</span> · '+esc(x.item_name)+' · Menge: '+x.quantity+' · Bestand danach: <b>'+x.stock_after+'</b><br><span class="muted">Bemerkung: '+esc(x.note||'–')+'</span></div>').join('')}
async function addMember(){let name=$('mName').value.trim(),rank=Number($('mRank').value);if(!name)return alert('Bitte einen Namen eintragen.');let {error}=await sb.from('members').insert({name,rank});if(error)alert(error.message);else{await loadAll();page('members')}}
async function setUserRole(id,role){if(!confirm('Benutzerrolle wirklich ändern?'))return;let {error}=await sb.from('profiles').update({role}).eq('id',id);if(error)alert(error.message);else{await loadAll();page('members')}}
async function delMember(id){if(!confirm('Mitglied wirklich löschen?'))return;let {error}=await sb.from('members').delete().eq('id',id);if(error)alert(error.message);else{await loadAll();page('members')}}
async function bookStock(key){let name=$('itemName').value.trim(),note=$('itemNote').value.trim(),type=$('moveType').value,qty=Number($('moveQty').value);if(!name||!Number.isInteger(qty)||qty<=0)return alert('Bitte Artikel und eine gültige Menge eingeben.');let {error}=await sb.rpc('rivera_book_stock',{p_warehouse:key,p_item_name:name,p_move_type:type,p_quantity:qty,p_note:note});if(error)alert(error.message);else{await loadAll();page(key)}}
async function addSimple(k){let v=$('simpleEntry').value.trim();if(!v)return;let {error}=await sb.from(k).insert({entry:v});if(error)alert(error.message);else{await loadAll();page(k)}}
async function delSimple(k,id){if(!confirm('Eintrag wirklich löschen?'))return;let {error}=await sb.from(k).delete().eq('id',id);if(error)alert(error.message);else{await loadAll();page(k)}}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
